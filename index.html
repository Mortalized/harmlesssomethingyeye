<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You've Won a Prize</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ---------- FAKE GIFT PAGE ---------- */
  body.gift {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
  }
  .card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 20px;
    max-width: 400px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .card h1 { font-size: 2em; margin-bottom: 10px; }
  .card p { margin-bottom: 25px; opacity: 0.9; }
  .btn {
    background: #ffdd57;
    color: #333;
    border: none;
    padding: 15px 40px;
    font-size: 1.1em;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .btn:hover { transform: scale(1.08); }
  .present { font-size: 5em; animation: bounce 1.5s infinite; display: inline-block; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  /* ---------- FAKE SYSTEM MESSAGE ---------- */
  body.terminal {
    background: #000;
    overflow: hidden;
  }
  #terminal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 15;
    background: #000;
    color: #0f0;
    font-family: "Courier New", monospace;
    font-size: 1.2em;
    padding: 30px;
    line-height: 1.7;
    white-space: pre-wrap;
  }
  #stealMsg {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 25;
    background: #000;
    color: #f00;
    font-family: "Courier New", monospace;
    font-size: clamp(2em, 8vw, 5em);
    font-weight: bold;
    letter-spacing: 4px;
    text-align: center;
    animation: flicker 0.12s infinite;
  }

  /* ---------- SCARY PART ---------- */
  body.scare {
    background: #000;
    overflow: hidden;
    cursor: none;
  }
  #scaryFace {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #scaryFace img {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    animation: shake 0.08s infinite;
  }
  @keyframes shake {
    0% { transform: translate(0,0) scale(1.02); }
    25% { transform: translate(-10px,6px) scale(1.05); }
    50% { transform: translate(8px,-8px) scale(1.03); }
    75% { transform: translate(-6px,-6px) scale(1.06); }
    100% { transform: translate(10px,4px) scale(1.02); }
  }
  #glitchText {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    color: #f00;
    font-family: "Courier New", monospace;
    font-size: 3.5em;
    font-weight: bold;
    text-align: center;
    text-shadow: 3px 0 #0ff, -3px 0 #f0f;
    animation: flicker 0.15s infinite;
    pointer-events: none;
    background: rgba(0,0,0,0.5);
    padding: 20px;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ---------- AFTERMATH ---------- */
  body.aftermath {
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .aftermath h2 { color: #4caf50; font-size: 2em; margin-bottom: 20px; }
  .aftermath p { max-width: 500px; line-height: 1.6; margin-bottom: 30px; opacity: 0.8; }
  .aftermath .big { font-size: 4em; margin-bottom: 20px; }
</style>
</head>
<body class="gift">

  <div class="card">
    <div class="present">&#127873;</div>
    <h1>You've Won a Prize!</h1>
    <p>Congratulations! You've been selected to receive a <b>$100 gift card</b>.<br>Click below to claim it!</p>
    <button class="btn" id="claimBtn">CLAIM NOW</button>
  </div>

  <!-- Scary stuff -->
  <div id="scaryFace">
    <!-- Scary face drawn with SVG so no external image is needed -->
    <img id="faceImg" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Crect width='400' height='400' fill='%23000'/%3E%3Cellipse cx='200' cy='210' rx='150' ry='180' fill='%23c9b8a8'/%3E%3Cellipse cx='140' cy='160' rx='35' ry='30' fill='%23fff'/%3E%3Cellipse cx='260' cy='160' rx='35' ry='30' fill='%23fff'/%3E%3Ccircle cx='142' cy='162' r='10' fill='%23000'/%3E%3Ccircle cx='258' cy='162' r='10' fill='%23000'/%3E%3Cpath d='M130 280 Q200 230 270 280 Q200 340 130 280 Z' fill='%232a0505'/%3E%3Cpath d='M145 278 L155 300 L165 278 L175 302 L185 278 L195 300 L205 278 L215 302 L225 278 L235 300 L245 278' stroke='%23fff' stroke-width='4' fill='none'/%3E%3Cpath d='M120 110 Q140 90 160 108' stroke='%23000' stroke-width='8' fill='none'/%3E%3Cpath d='M240 108 Q260 90 280 110' stroke='%23000' stroke-width='8' fill='none'/%3E%3C/svg%3E">
  </div>
  <div id="glitchText">I SEE YOU</div>
  <div id="terminal"></div>
  <div id="stealMsg">THX FOR UR INFO</div>

  <script>
    const claimBtn = document.getElementById('claimBtn');
    const scaryFace = document.getElementById('scaryFace');
    const glitchText = document.getElementById('glitchText');
    const terminal = document.getElementById('terminal');
    const stealMsg = document.getElementById('stealMsg');

    function playScream() {
      // Creepy screech synthesized with Web Audio API (no files needed)
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;

      // Discordant high screech
      [620, 830, 1150, 1580].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = i % 2 ? 'sawtooth' : 'square';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.linearRampToValueAtTime(freq * 0.6, now + 1.5);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 1.5);
      });

      // Low rumble for extra dread
      const rumble = ctx.createOscillator();
      const rGain = ctx.createGain();
      rumble.type = 'sine';
      rumble.frequency.setValueAtTime(55, now);
      rumble.frequency.exponentialRampToValueAtTime(30, now + 2);
      rGain.gain.setValueAtTime(0.4, now);
      rGain.gain.exponentialRampToValueAtTime(0.001, now + 2);
      rumble.connect(rGain).connect(ctx.destination);
      rumble.start(now);
      rumble.stop(now + 2);
    }

    claimBtn.addEventListener('click', () => {
      // Fullscreen makes it way scarier (browsers require a user gesture — we have one!)
      document.documentElement.requestFullscreen?.().catch(() => {});

      // ---------- PHASE 1: FAKE SYSTEM MESSAGE ----------
      document.body.className = 'terminal';
      document.querySelector('.card').style.display = 'none';
      terminal.style.display = 'block';

      const lines = [
        '> Establishing connection... OK',
        '> Accessing device... OK',
        '> Reading contacts... DONE',
        '> Reading browser history... DONE',
        '> Uploading personal data... 47%',
        '> Uploading personal data... 89%',
        '> Uploading personal data... 100%',
        '> Formatting C:\\ drive... '
      ];
      let lineIndex = 0;
      const typeLine = () => {
        if (lineIndex < lines.length) {
          terminal.textContent += lines[lineIndex] + '\n';
          lineIndex++;
          setTimeout(typeLine, 350);
        } else {
          // ---------- PHASE 2: "THX FOR UR INFO" ----------
          terminal.style.display = 'none';
          stealMsg.style.display = 'flex';
          setTimeout(startScare, 1400);
        }
      };
      typeLine();
    });

    function startScare() {
      playScream();
      document.body.className = 'scare';
      scaryFace.style.display = 'flex';

      // Flash glitchy messages
      const messages = [
        'I SEE YOU',
        'WHY DID YOU CLICK?',
        'IT\'S BEHIND YOU...',
        'DON\'T LOOK AWAY',
        'HELLO?'
      ];
      let msgIndex = 0;
      const glitchLoop = setInterval(() => {
        glitchText.textContent = messages[msgIndex % messages.length];
        glitchText.style.display = 'flex';
        setTimeout(() => glitchText.style.display = 'none', 300);
        msgIndex++;
      }, 700);

      // Total scare duration: ~3 seconds, then reveal it's a prank
      setTimeout(() => {
        clearInterval(glitchLoop);
        glitchText.style.display = 'none';
        stealMsg.style.display = 'none';
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});

        document.body.className = 'aftermath';
        document.body.innerHTML = `
          <div class="big">HA HA</div>
          <h2>GOT YOU!</h2>
          <p>It was all a prank. Nothing happened to your computer, your files are fine,
          and nothing was uploaded anywhere. You just got jump-scared by your friend.</p>
          <p>Click anywhere to continue with your day.</p>
        `;
      }, 3000);
    }
  </script>
</body>
</html>
